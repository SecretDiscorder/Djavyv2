{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Perfect Winner Assets</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .item {
            width: 220px;
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Perfect-Winner Assets</h1>

    <div class="gallery">

        {% for image in images %}

        <div class="item">

            <img
                src="{% static 'perfect-winner/' %}{{ image }}"
                alt="{{ image }}"
            >

            <p>{{ image }}</p>

        </div>

        {% endfor %}

    </div>

</body>
</html>
