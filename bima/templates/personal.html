<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bima Adhi Pratama Kharis - Personal Portfolio</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       RESET
    ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.65)
        ),
        url("/static/assets/images/featured-5.png");

      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    a {
      text-decoration: none;
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    #check {
      display: none;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: -260px;

      width: 260px;
      height: 100vh;

      background: rgba(4, 35, 49, 0.98);

      transition: left 0.5s ease;

      z-index: 1000;

      box-shadow: 5px 0 20px rgba(0, 0, 0, 0.4);
    }

    #sidebar ul {
      list-style: none;
      margin-top: 80px;
    }

    #sidebar ul li a {
      display: block;

      height: 60px;
      line-height: 60px;

      padding-left: 25px;

      color: white;

      font-size: 17px;
      font-weight: 500;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      transition: all 0.3s ease;
    }

    #sidebar ul li a:hover {
      background: #0a5275;
      padding-left: 35px;
    }


    /* =========================================================
       SIDEBAR BUTTON
    ========================================================= */

    label #btn,
    label #cancel {
      position: fixed;

      cursor: pointer;

      z-index: 1100;

      transition: all 0.4s ease;
    }

    label #btn {
      top: 20px;
      left: 20px;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(4, 35, 49, 0.9);

      border-radius: 10px;

      color: white;

      font-size: 28px;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    label #btn:hover {
      background: #0a5275;
    }

    label #cancel {
      top: 20px;
      left: -210px;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0a5275;

      border-radius: 10px;

      color: white;

      font-size: 32px;
    }

    label #cancel:hover {
      background: #007bbf;
    }


    /* =========================================================
       SIDEBAR ACTIVE STATE
    ========================================================= */

    #check:checked ~ #sidebar {
      left: 0;
    }

    #check:checked ~ label #btn {
      left: 280px;

      opacity: 0;

      pointer-events: none;
    }

    #check:checked ~ label #cancel {
      left: 280px;
    }


    /* =========================================================
       MAIN
    ========================================================= */

    main {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      width: 100%;
      max-width: 1100px;

      min-height: 100vh;

      padding: 100px 30px 60px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 20px;
    }

    .hero-title {
      font-size: 2.7rem;
      font-weight: 700;

      text-shadow:
        0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .hero h2 {
      font-size: 2rem;
      font-weight: 600;

      margin-top: 5px;
    }

    .hero-description {
      max-width: 750px;

      font-size: 1.05rem;
      font-weight: 400;

      line-height: 1.8;

      color: #f1f1f1;
    }


    /* =========================================================
       OVAL LOGO / HERO IMAGE
    ========================================================= */

    .logo {
      width: 300px;
      height: 300px;

      overflow: hidden;

      border-radius: 50%;

      border: 4px solid rgba(255, 255, 255, 0.8);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.5);

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.05);

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.7);
    }

    .logo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================================================
       CARD BOARD
    ========================================================= */

    .card-board {
      width: 100%;
      max-width: 700px;

      margin-top: 25px;

      padding: 25px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 25px;

      background: rgba(0, 0, 0, 0.55);

      border: 1px solid rgba(255, 255, 255, 0.1);

      border-radius: 20px;

      backdrop-filter: blur(8px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.4);
    }


    /* =========================================================
       CARD BUTTON
    ========================================================= */

    .card-board a {
      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.08);

      border-radius: 20px;

      border: 1px solid rgba(255, 255, 255, 0.15);

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .card-board a:hover {
      transform: translateY(-8px) scale(1.05);

      background: rgba(0, 123, 191, 0.8);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card-board img {
      width: 75px;
      height: 75px;

      object-fit: contain;

      border-radius: 15px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      width: 100%;

      padding: 25px 20px;

      background: rgba(0, 0, 0, 0.65);

      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    footer p {
      margin: 5px 0;

      font-size: 0.85rem;

      color: #ccc;
    }

    .about-dev a,
    footer a {
      color: #38a9ff;

      font-weight: 500;

      transition: color 0.3s ease;
    }

    .about-dev a:hover,
    footer a:hover {
      color: white;

      text-decoration: underline;
    }


    /* =========================================================
       RESPONSIVE — TABLET
    ========================================================= */

    @media (max-width: 768px) {

      .hero {
        padding: 90px 20px 50px;
      }

      .hero-title {
        font-size: 2.1rem;
      }

      .hero h2 {
        font-size: 1.6rem;
      }

      .hero-description {
        font-size: 0.95rem;
      }

      .logo {
        width: 260px;
        height: 155px;
      }

      .card-board {
        gap: 15px;
      }

      .card-board a {
        width: 85px;
        height: 85px;
      }

      .card-board img {
        width: 65px;
        height: 65px;
      }
    }


    /* =========================================================
       RESPONSIVE — MOBILE
    ========================================================= */

    @media (max-width: 480px) {

      .hero {
        padding: 80px 15px 40px;
      }

      .hero-title {
        font-size: 1.7rem;
      }

      .hero h2 {
        font-size: 1.35rem;
      }

      .hero-description {
        font-size: 0.85rem;
      }

      .logo {
        width: 220px;
        height: 135px;
      }

      .card-board {
        padding: 20px 10px;

        gap: 12px;
      }

      .card-board a {
        width: 75px;
        height: 75px;
      }

      .card-board img {
        width: 55px;
        height: 55px;
      }

      label #btn {
        top: 15px;
        left: 15px;

        width: 45px;
        height: 45px;

        font-size: 24px;
      }

      label #cancel {
        top: 15px;
      }

      footer p {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
