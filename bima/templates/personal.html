
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bima Adhi Pratama Kharis | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            background:
                linear-gradient(rgba(3, 18, 30, .78), rgba(3, 18, 30, .88)),
                url("{% static 'assets/images/featured-5.png' %}")
                center / cover fixed no-repeat;
        }

        main {
            min-height: calc(100vh - 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .hero {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            margin-bottom: 30px;
        }

        .profile-image {
            width: 210px;
            height: 210px;
            margin: auto;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .4);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h2 {
            font-size: 1.8rem;
            margin-top: 25px;
            font-weight: 600;
        }

        .description {
            max-width: 600px;
            margin: 12px auto 30px;
            color: #d1dce5;
            font-size: .95rem;
            line-height: 1.8;
        }

        .card-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 520px;
            margin: 30px auto 0;
        }

        .card-board a {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 16px;
            transition: .25s ease;
        }

        .card-board a:hover {
            background: #087db5;
            transform: translateY(-5px);
            border-color: #087db5;
        }

        .card-board img {
            width: 65%;
            height: 65%;
            object-fit: contain;
        }

        footer {
            min-height: 90px;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, .45);
            border-top: 1px solid rgba(255, 255, 255, .1);
        }

        footer p {
            color: #aebdca;
            font-size: .8rem;
            line-height: 1.8;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        footer a:hover {
            color: #fff;
        }

        @media (max-width: 480px) {
            main {
                padding: 40px 18px;
            }

            .profile-image {
                width: 170px;
                height: 170px;
            }

            .hero h2 {
                font-size: 1.4rem;
            }

            .description {
                font-size: .85rem;
            }

            .card-board {
                gap: 10px;
            }

            .card-board a {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="hero">

            <h1>Bima Adhi Pratama Kharis</h1>

            <div class="profile-image">
                <img
                    src="{% static 'assets/images/hero-banner.png' %}"
                    alt="Bima Adhi Pratama Kharis"
                >
            </div>

            <h2>Hello Everyone!</h2>

            <p class="description">
                I'm Bima Adhi Pratama Kharis,
                a conqueror from the past.
                Welcome to my personal portfolio blog.
            </p>

            <div class="card-board">

                <a href="/home" title="Personal Profile">
                    <img src="{% static 'assets/images/pp.png' %}" alt="Profile">
                </a>

                <a href="/project/" title="Project Gallery">
                    <img src="{% static 'assets/images/project.png' %}" alt="Projects">
                </a>

                <a href="http://localhost/" title="Home">
                    <img src="{% static 'assets/images/hm.png' %}" alt="Home">
                </a>

                <a href="/base" title="My Works">
                    <img src="{% static 'assets/images/an.png' %}" alt="Works">
                </a>

            </div>

        </section>
    </main>

    <footer>
        <p>
            Website developed by
            <a href="/profile/">SecretDiscorder</a>
        </p>

        <p>
            &copy; 2026 SecretDiscorder. All Rights Reserved.
        </p>
    </footer>

</body>
</html>
